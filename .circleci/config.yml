version: 2.1

functions:
  setup-java: github.com/circleci-functions/setup-java@v0.4.0

executors:
  clojure:
    docker:
      - image: cimg/clojure:1.11

jobs:
  clj-kondo:
    docker:
      - image: cljkondo/clj-kondo:2026.10.26
    steps:
      - checkout
      - run: clj-kondo --lint .

  test-deps-plus:
    executor: clojure
    steps:
      - checkout
      - setup-java/cache-dependencies:
          with:
            build-tool: lein
      - run: lein test-ci
      - store_test_results:
          path: target/test-results
      - store_artifacts:
          path: "target/coverage"

  publish:
    executor: clojure
    steps:
      - checkout
      - setup-java/cache-dependencies:
          with:
            build-tool: lein
            cache-read-only: true
      - run:
          name: Download dependencies
          command: lein deps
      - run:
          name: Publish to clojars
          command: lein deploy

workflows:
  build-test:
    jobs:
      - clj-kondo
      - test-deps-plus
      - publish:
          context: clojars-publish
          requires:
            - test-deps-plus
          filters:
            branches:
              only:
                - main
